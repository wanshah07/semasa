<!doctype html>
<html lang="en"><meta charset="utf-8"><script src="assets/gsap.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:540px;height:960px;overflow:hidden;color:#123f3b;font-family:Arial,sans-serif}#root{position:relative;width:540px;height:960px;overflow:hidden;background:linear-gradient(145deg,#e1f3e8,#fff8eb 80%)}#story,#outro{position:absolute;inset:0}h1{position:absolute;left:48px;top:146px;width:420px;text-align:center;font-size:36px;line-height:1.15;letter-spacing:-1px;margin:0;font-weight:800}#photo{position:absolute;left:100px;top:282px;width:340px;height:330px;overflow:hidden;border-radius:6px;box-shadow:14px 16px 0 #cde5d7}#photo img{width:100%;height:100%;object-fit:cover;object-position:50% 51%}#relation{position:absolute;left:60px;top:659px;width:410px;height:88px}#relation text{font:25px Arial,sans-serif;fill:#123f3b;text-anchor:middle}#outro{visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#e1f3e8,#fff8eb 80%)}#logo{width:410px;height:auto}#cta{font-size:29px;margin-top:44px;text-align:center}
</style><body>
<main id="root" data-composition-id="main" data-duration="8" data-start="0" data-width="540" data-height="960" data-fps="24">
<section id="story"><h1>One ingredient isn’t<br>the whole formula.</h1><div id="photo"><img src="assets/bottle.jpg" alt="Illustrative stock bottle photograph"></div>
<svg id="relation" viewBox="0 0 410 88" aria-label="An ingredient contributes to a broader formula, not a measured chart">
<rect x="0" y="0" width="145" height="65" rx="12" fill="#d2e9da"/><text x="72" y="41">ingredient</text>
<path id="arrow" d="M158 33 H233 M222 24 L234 33 L222 42" fill="none" stroke="#3c7e69" stroke-width="3" stroke-linejoin="round"/>
<rect x="246" y="0" width="159" height="65" rx="12" fill="#f0e4c8"/><text x="325" y="41">formula</text></svg></section>
<section id="outro"><img id="logo" src="assets/official-logo-transparent.png" alt="WS Regulab Solutions, Trusted.Proven.Clarity."><div id="cta">Follow us for more</div></section></main>
<script>
const tl=gsap.timeline({paused:true});
tl.fromTo('h1',{opacity:0,y:16},{opacity:1,y:0,duration:.45,ease:'power2.out'},0);
tl.fromTo('#photo',{opacity:0,y:22},{opacity:1,y:0,duration:.65,ease:'power2.out'},.2);
tl.fromTo('#photo img',{scale:1.035},{scale:1,duration:4.4,ease:'power1.inOut'},.3);
tl.fromTo('#relation',{opacity:0,y:8},{opacity:1,y:0,duration:.45,ease:'power2.out'},.55);
tl.fromTo('#arrow',{strokeDasharray:110,strokeDashoffset:110},{strokeDashoffset:0,duration:.65,ease:'power2.inOut'},.8);
tl.set('#story',{visibility:'hidden'},4.666666666666667);
tl.set('#outro',{visibility:'visible'},4.666666666666667);
tl.fromTo('#logo',{y:12},{y:0,duration:.4,ease:'power2.out'},4.666666666666667);
tl.set('#cta',{opacity:1},4.666666666666667);
tl.to({}, {duration:.01},7.99);window.__timelines={main:tl};tl.seek(0);
</script></body></html>
