name: API credit

# How much API credit is left, and until when, for Mireld, rootsys and KiosAPI (Wan, 23 Nov 2026: "pantau berapa banyak realtime baki
# credit API tinggal dan validity"). Every 15 minutes it asks each gateway's balance endpoints with that gateway's own key (no chat
# question, no model list: backend/semasa/api_credit.py) and writes the answer into semasa_api_status.balance for the "Baki kredit
# API" page. The 6-hourly "API status" run does the same reading as part of its full probe.
#
# Cost: 96 runs a day, about one billed minute each (setup, install and a dozen quick GETs), so roughly 2,900 runner minutes a
# month. GitHub's free private-repo allowance is 2,000 and Pro's is 3,000. To halve it, change "*/15" to "*/30".
# GitHub may start a scheduled run several minutes late when it is busy; "Refresh now" on the page dispatches `credit_check`
# (supabase/092_api_credit.sql) and the run starts within seconds.
on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [credit_check]
  workflow_dispatch:

concurrency:
  group: api-credit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  credit:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Read the credit left
        # the same secrets and variables as api.yml: it finds the same keys the full probe does
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          # optional: KiosAPI keeps the top-up on the account, which a key cannot read (api_credit.account_headers)
          KIOSAPI_ACCESS_TOKEN: ${{ secrets.KIOSAPI_ACCESS_TOKEN }}
          KIOSAPI_USER_ID: ${{ secrets.KIOSAPI_USER_ID }}
          LLM_ALLOWED_HOSTS: ${{ vars.LLM_ALLOWED_HOSTS }}
          LLM_FALLBACK_ALLOWED_HOSTS: ${{ vars.LLM_FALLBACK_ALLOWED_HOSTS }}
        run: python -m semasa.api_status --credit-only
