name: API status

# AI gateway status (Wan, 9 Oct 2026): every 6 hours, ask rootsys (Afiq's) and Mireld whether they are up, whether each
# key is accepted, which models they list, whether the configured model is among them, and what balance they report, then
# write semasa_api_status for the API tab. Token USAGE is not read here: every worker run writes it as it goes
# (api_status.attach). Same secrets and variables as the scrape, because it probes the same configuration.
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

concurrency:
  group: api-status
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe the gateways
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_ALLOWED_HOSTS: ${{ vars.LLM_ALLOWED_HOSTS }}
          LLM_FALLBACK_ALLOWED_HOSTS: ${{ vars.LLM_FALLBACK_ALLOWED_HOSTS }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
        run: python -m semasa.api_status
