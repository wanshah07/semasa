name: Billing

# Bil (Wan, 7 Oct 2026): quotations, invoices and receipts. This run
#   1. sends every e-mail waiting in semasa_billing_outbox (the PDF is drawn in Chrome and attached; the mail goes out
#      from Wan's own Gmail through Composio For You, the same road the LinkedIn publisher uses);
#   2. once a day, queues reminders for invoices past their due date (semasa_settings.billing.email.reminder_days) and
#      marks quotations past their validity as expired.
# Woken by the database within seconds of a Send click (supabase/028_billing.sql, repository_dispatch 'billing_pending');
# the daily schedule is the net for reminders and for a dispatch GitHub dropped. One schedule, in the repo that owns the job.
on:
  repository_dispatch:
    types: [billing_pending]
  schedule:
    - cron: "15 1 * * *"          # 09:15 MYT
  workflow_dispatch:

concurrency:
  group: billing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  billing:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Send and remind
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPOSIO_CONSUMER_KEY: ${{ secrets.COMPOSIO_CONSUMER_KEY }}
          SEMASA_SITE_URL: ${{ vars.SEMASA_SITE_URL }}
        run: python -m semasa.billing
