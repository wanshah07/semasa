name: Tanya Otak

# Tanya Otak (Wan, 11 Nov 2026): answer a question from the Otak AI brain, cited. The synthesis half of a second brain,
# built on the entries Otak AI files (GBrain's idea applied to Semasa). Woken by the database within seconds of a question
# (supabase/078_brain_ask.sql, repository_dispatch 'brain_ask_pending'); the schedule is the net for a dispatch GitHub
# dropped. One schedule, in the repo that owns the job.
on:
  repository_dispatch:
    types: [brain_ask_pending]
  schedule:
    - cron: "59 2 * * *"          # 10:59 MYT
  workflow_dispatch:

concurrency:
  group: brain-ask
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ask:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Answer the questions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ALLOWED_HOSTS: ${{ vars.LLM_ALLOWED_HOSTS }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          LLM_FALLBACK_ALLOWED_HOSTS: ${{ vars.LLM_FALLBACK_ALLOWED_HOSTS }}
        run: python -m semasa.brain_ask
