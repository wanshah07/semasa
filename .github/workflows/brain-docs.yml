name: Dokumen AI

# Documents from the FAQ and the Otak AI brain (Wan, 11 Oct 2026): a request made in the Otak or FAQ tab is drafted by the AI
# gateway as a SOP, NCR, comparison, FAQ document and more, in Bahasa Malaysia, English or both, always as a DRAFT FOR REVIEW.
# Woken by the database within seconds of a request (supabase/037_brain_docs.sql, repository_dispatch 'brain_doc_pending');
# the schedule is the net for a dispatch GitHub dropped. One schedule, in the repo that owns the job.
on:
  repository_dispatch:
    types: [brain_doc_pending]
  schedule:
    - cron: "55 2 * * *"          # 10:55 MYT
  workflow_dispatch:

concurrency:
  group: brain-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  documents:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Draft the documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ALLOWED_HOSTS: ${{ vars.LLM_ALLOWED_HOSTS }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          LLM_FALLBACK_ALLOWED_HOSTS: ${{ vars.LLM_FALLBACK_ALLOWED_HOSTS }}
        run: python -m semasa.brain_docs
