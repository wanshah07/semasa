name: ChatGPT login

# Log in to ChatGPT from the Motion tab with a link and a one-time code (Wan, 6 Nov 2026). The page asks (supabase/059:
# semasa_chatgpt_device_start), the database wakes this workflow with repository_dispatch 'chatgpt_login', and backend/semasa/
# chatgpt_device.py gets a code from OpenAI, shows it on the card, waits up to 15 minutes for Wan to approve it at
# auth.openai.com/codex/device and saves the tokens where the Motion worker reads them. A new code (the card's button) cancels the
# run in progress and starts another. No GitHub secret beyond the two Supabase ones is used, and no token is printed.
on:
  repository_dispatch:
    types: [chatgpt_login]
  workflow_dispatch:

concurrency:
  group: chatgpt-login
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  login:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Get a code and wait for the approval
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m semasa.chatgpt_device
