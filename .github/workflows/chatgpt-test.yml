name: ChatGPT live test

# A manual test of Wan's ChatGPT login (8 Nov 2026): one short answer, one picture read, one picture drawn. Run by hand from the
# Actions tab; it has no schedule and is not wired to anything else, so it can never double a job. The drawn picture is kept as
# an artifact for three days.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Write, read and draw through ChatGPT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m semasa.chatgpt_test "$RUNNER_TEMP/chatgpt-out" | tee "$RUNNER_TEMP/result.txt"
      - name: Summary
        if: always()
        run: grep '^RESULT' "$RUNNER_TEMP/result.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the drawn picture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-drawn
          path: ${{ runner.temp }}/chatgpt-out
          retention-days: 3
          if-no-files-found: ignore
