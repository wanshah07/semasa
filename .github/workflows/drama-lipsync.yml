name: Drama lipsync

# Two-character drama lipsync (SadTalker, CPU): each character photo is animated to their
# Malay speech audio, then the two talking clips are cut into a shot-reverse-shot scene with
# burned subtitles. This is the "watak cakap macam drama" pipeline for the WS series.
#
# Inputs live in assets/drama-ep01/ (siti.png, aiman.png, Siti-audio.wav, Aiman-audio.wav,
# voice-manifest.json). Reusable per episode by changing that folder.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode assets folder under assets/"
        default: "drama-ep01"

permissions:
  contents: read

jobs:
  lipsync:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: ffmpeg
        run: bash .github/scripts/ensure-ffmpeg.sh
      - name: Install SadTalker
        run: |
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git
          python -m venv st-venv
          . st-venv/bin/activate
          pip install -q --upgrade pip wheel "setuptools<70"
          pip install -q torch==2.1.2 torchvision==0.16.2 torchaudio==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.23.4 scipy==1.10.1 scikit-image==0.19.3 face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 \
            librosa==0.9.2 numba resampy==0.3.1 pydub==0.25.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 \
            facexlib==0.3.0 basicsr==1.4.2 safetensors av gfpgan
      - name: Models
        run: |
          cd SadTalker
          mkdir -p checkpoints gfpgan/weights
          B=https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc
          wget -nv -nc "$B/mapping_00109-model.pth.tar" -O checkpoints/mapping_00109-model.pth.tar
          wget -nv -nc "$B/mapping_00229-model.pth.tar" -O checkpoints/mapping_00229-model.pth.tar
          wget -nv -nc "$B/SadTalker_V0.0.2_256.safetensors" -O checkpoints/SadTalker_V0.0.2_256.safetensors
          F=https://github.com/xinntao/facexlib/releases/download/v0.1.0
          wget -nv -nc "$F/alignment_WFLW_4HG.pth" -O gfpgan/weights/alignment_WFLW_4HG.pth
          wget -nv -nc "$F/detection_Resnet50_Final.pth" -O gfpgan/weights/detection_Resnet50_Final.pth
      - name: Animate Siti and Aiman
        run: |
          . st-venv/bin/activate
          cd SadTalker
          python inference.py --driven_audio ../assets/${{ inputs.episode }}/Siti-audio.wav --source_image ../assets/${{ inputs.episode }}/siti.png --result_dir ../out-siti --still --preprocess crop --size 256 --batch_size 1 --cpu 2>&1 | tail -6
          python inference.py --driven_audio ../assets/${{ inputs.episode }}/Aiman-audio.wav --source_image ../assets/${{ inputs.episode }}/aiman.png --result_dir ../out-aiman --still --preprocess crop --size 256 --batch_size 1 --cpu 2>&1 | tail -6
          ls -la ../out-siti ../out-aiman
      - name: Cut shot-reverse-shot + subtitles
        run: |
          . st-venv/bin/activate
          SITI=$(find out-siti -name '*.mp4' | head -1)
          AIMAN=$(find out-aiman -name '*.mp4' | head -1)
          echo "SITI=$SITI AIMAN=$AIMAN"
          ffprobe -v error -show_entries stream=width,height,duration,r_frame_rate -of compact "$SITI"
          ffprobe -v error -show_entries stream=width,height,duration,r_frame_rate -of compact "$AIMAN"
          python assemble_drama.py "$SITI" "$AIMAN" assets/${{ inputs.episode }}/voice-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drama-episode
          path: |
            *.mp4
            *.png
          if-no-files-found: warn
