name: Deploy functions

# Deploys every Supabase Edge Function under supabase/functions/ to the kpi-system project (mwaocnbgvbkhovktgods)
# whenever a function changes on main. Wan presses Merge; this does the `supabase functions deploy`.
#
# Needs ONE repo secret: SUPABASE_ACCESS_TOKEN (Supabase dashboard → Account → Access Tokens).
# Type it into GitHub → Settings → Secrets and variables → Actions. Never paste it into a chat.
#
# The runner only talks to Supabase's deploy API. It never calls api.mireld.my, so the 19 Sep 2026 block on GitHub
# runners does not matter here; the Mireld call happens later, from inside Supabase.
#
# JWT verification stays ON (the default). The function also checks auth.getUser + semasa_is_uploader() itself.

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/functions.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'wanshah07/semasa'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mwaocnbgvbkhovktgods
    steps:
      - uses: actions/checkout@v4

      - name: Stop early if the token is missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repo secret (Settings → Secrets and variables → Actions), then re-run."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The Telegram webhook's secret header, derived from the bot token exactly as telegram_bot.webhook_secret does, so
      # there is no second secret to keep. Skipped (with a notice) while TELEGRAM_BOT_TOKEN is not set.
      # A NEW bot token means a new secret: the Telegram worker re-sends it to Telegram by itself (it keeps a fingerprint in
      # settings.telegram_bot.secret_fp), but this function only learns it when this workflow runs again. Run it by hand
      # (Actions → Deploy functions → Run workflow) after changing TELEGRAM_BOT_TOKEN; the watchdog says so if it is missed.
      - name: Telegram webhook secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::notice::TELEGRAM_BOT_TOKEN not set: the Telegram webhook stays off"; exit 0; fi
          secret=$(printf %s "semasa-telegram-webhook" | openssl dgst -sha256 -hmac "$TELEGRAM_BOT_TOKEN" -r | cut -d' ' -f1)
          echo "::add-mask::$secret"
          supabase secrets set "TELEGRAM_WEBHOOK_SECRET=$secret" --project-ref "$PROJECT_REF" --yes   # no terminal to confirm on

      - name: Deploy each function
        run: |
          set -e
          found=0
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*|.*) continue ;; esac   # _shared etc. are not functions
            [ -f "$dir/index.ts" ] || continue
            found=1
            echo "::group::deploy $name"
            # Telegram's webhook carries no Supabase login: its secret header is the gate (semasa-telegram/index.ts)
            if [ "$name" = "semasa-telegram" ]; then extra="--no-verify-jwt"; else extra=""; fi
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api --yes $extra
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "::error::no functions found under supabase/functions/"; exit 1; }

      - name: List what is live now
        run: supabase functions list --project-ref "$PROJECT_REF"
