name: Health report

# Health report (Wan, 7 Nov 2026: "send notification email for any update or problem but you must fix them automatically and send
# the report"). Every 6 hours backend/semasa/health.py fixes what is safe to fix by itself (a publisher error left by a bug that
# is fixed, an idea the writer did not answer), checks the workflows, the AI gateways, Gemini, the ChatGPT login, the publisher,
# billing and the Gmail connection, and e-mails Wan when there is something new, plus a summary every morning (the 01:17 UTC run,
# 09:17 MYT). One schedule, in the repo that owns the job.
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  health:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Check, fix and report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPOSIO_CONSUMER_KEY: ${{ secrets.COMPOSIO_CONSUMER_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_EMAIL: ${{ vars.HEALTH_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m semasa.health
