name: Motion

# Motion (Wan, 23 Oct 2026): a motion-graphics video from an idea or a link. The AI team's writer writes the HTML composition
# to the HyperFrames contract, `hyperframes check` validates it, `hyperframes render` turns it into an MP4 on this runner
# (Chrome + ffmpeg are on ubuntu-latest), and the file lands in the semasa-generated bucket for the Video tab
# (backend/semasa/motion.py, supabase/043_motion.sql). Woken by the database on a new pending row (repository_dispatch
# 'motion_pending'); the hourly schedule is the net for a dispatch GitHub dropped. One schedule, in the repo that owns the job.
on:
  repository_dispatch:
    types: [motion_pending]
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

concurrency:
  group: motion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  motion:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          # ubuntu-latest no longer ships ffmpeg (hyperframes doctor, 24 Oct 2026: "FFmpeg is required to encode video")
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          npx -y hyperframes@0.8.188 doctor || true          # warms the npx cache and says what the runner has
      - name: Write, check and render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}                # reads the style repo's README/skill files (public ones need none)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HYPERFRAMES_SKIP_SKILLS: "1"
          # the optional AI background is drawn by the page's image slot (KiosAPI in Tetapan), else these, as media.yml has them
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ALLOWED_HOSTS: ${{ vars.LLM_ALLOWED_HOSTS }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          LLM_FALLBACK_ALLOWED_HOSTS: ${{ vars.LLM_FALLBACK_ALLOWED_HOSTS }}
          LLM_TIMEOUT: "180"
        run: python -m semasa.motion
