name: Nexabot comic film

# Animate the four comic panels into short clips (one panel per i2v generation) and concatenate them into one film,
# then hand the film to Semasa's import-video route (draft post; Wan's Approve is the only gate).
# By hand only. The 4 panel PNGs live in web/public/comic-panels/ (temporary, replaced each episode).

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Built-in short-film category whose panel lines are burned in"
        type: string
        default: "kisah-keluarga-halal"
      dry:
        description: "true = do everything except press Generate (spends nothing)"
        type: boolean
        default: true

concurrency:
  group: nexabot-comic-film
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  film:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Animate the panels
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
          NB_CATEGORY: ${{ inputs.category }}
          NB_DRY: ${{ inputs.dry }}
        run: |
          args=("$RUNNER_TEMP/nexabot-film" --category "${NB_CATEGORY:-kisah-keluarga-halal}")
          if [ "$NB_DRY" = "true" ]; then args+=(--dry); fi
          python -m semasa.nexabot_comic_film "${args[@]}"
      - name: Keep the film and report (one day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-comic-film
          path: /home/runner/work/_temp/nexabot-film
          retention-days: 1
          if-no-files-found: ignore
