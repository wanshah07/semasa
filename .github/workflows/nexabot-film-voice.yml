name: Nexabot film voice

# Generate all 6 dialogue lines for the comic film (Hana=Sulafat, Hassan=Aoede) via the Voice Generator.
on:
  workflow_dispatch:

concurrency:
  group: nexabot-film-voice
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  voice:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Generate 6 lines
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
        run: python -m semasa.nexabot_film_voice_retry "$RUNNER_TEMP/nexabot-film-voice"
      - name: Keep audio and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-film-voice
          path: /home/runner/work/_temp/nexabot-film-voice
          retention-days: 1
          if-no-files-found: ignore
