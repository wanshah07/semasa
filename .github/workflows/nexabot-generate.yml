name: Nexabot generate

# Phase B, first real run: drive the Creator Studio with the saved session login, generate ONE video (Unlimited plan,
# no credits), capture the MP4, and — when --import is on — send it to Semasa's import-video route, which makes a DRAFT
# post. Wan's Approve is the only gate. By hand only; no schedule.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "The video prompt"
        required: true
        type: string
      dry:
        description: "true = do everything except press Generate (spends nothing)"
        type: boolean
        default: true
      import:
        description: "true = send the MP4 to Semasa import-video (needs SEMASA_IMPORT_TOKEN)"
        type: boolean
        default: false
      title:
        description: "Optional. The post's title (default: the prompt). Only used with import"
        type: string
        default: ""
      caption:
        description: "Optional. One caption for every channel. Leave empty and captions_json empty to let Semasa write one from the title. Only used with import"
        type: string
        default: ""
      captions_json:
        description: 'Optional. A caption per channel as JSON, e.g. {"instagram": "...", "facebook": "...", "threads": "..."}. Only used with import'
        type: string
        default: ""
      channels:
        description: "Optional. Comma list of channels: instagram,facebook,threads (default: all three). Only used with import"
        type: string
        default: ""
      lang:
        description: "Optional. bm or en (default bm). Only used with import"
        type: string
        default: ""

concurrency:
  group: nexabot-generate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Generate one video
        # every input reaches the script through an environment variable: a caption can hold quotes, $ and backticks, and none of
        # it is ever pasted into shell text
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
          SEMASA_IMPORT_TOKEN: ${{ secrets.SEMASA_IMPORT_TOKEN }}
          SEMASA_IMPORT_URL: ${{ vars.SEMASA_IMPORT_URL }}
          NB_PROMPT: ${{ inputs.prompt }}
          NB_DRY: ${{ inputs.dry }}
          NB_IMPORT: ${{ inputs.import }}
          NB_TITLE: ${{ inputs.title }}
          NB_CAPTION: ${{ inputs.caption }}
          NB_CAPTIONS_JSON: ${{ inputs.captions_json }}
          NB_CHANNELS: ${{ inputs.channels }}
          NB_LANG: ${{ inputs.lang }}
        run: |
          args=("$RUNNER_TEMP/nexabot-out" --prompt "$NB_PROMPT")
          if [ "$NB_DRY" = "true" ]; then
            args+=(--dry)
          elif [ "$NB_IMPORT" = "true" ]; then
            args+=(--import)
            if [ -n "$NB_TITLE" ]; then args+=(--title "$NB_TITLE"); fi
            if [ -n "$NB_CAPTION" ]; then args+=(--caption "$NB_CAPTION"); fi
            if [ -n "$NB_CAPTIONS_JSON" ]; then args+=(--captions-json "$NB_CAPTIONS_JSON"); fi
            if [ -n "$NB_CHANNELS" ]; then args+=(--channels "$NB_CHANNELS"); fi
            if [ -n "$NB_LANG" ]; then args+=(--lang "$NB_LANG"); fi
          fi
          python -m semasa.nexabot_generate "${args[@]}"
      - name: Keep the video and report (one day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-generate
          path: /home/runner/work/_temp/nexabot-out
          retention-days: 1
          if-no-files-found: ignore
