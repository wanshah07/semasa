name: Nexabot jobs raw probe

# Read-only: dump the RAW /api/v1/jobs responses (multiple scopes + account/stats endpoints)
# to see where queued/processing jobs actually live.
on:
  workflow_dispatch:

concurrency:
  group: nexabot-jobs-raw
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Dump raw jobs
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
        run: python -m semasa.nexabot_jobs_raw "$RUNNER_TEMP/nexabot-jobs-raw"
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-jobs-raw
          path: /home/runner/work/_temp/nexabot-jobs-raw
          retention-days: 1
          if-no-files-found: ignore
