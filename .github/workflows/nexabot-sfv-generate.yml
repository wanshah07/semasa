name: Nexabot sfv generate

# Generate ONE scene with the character sheet as Start Frame (consistent characters). No dialogue in the prompt.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Scene description (NO dialogue)"
        required: true
      dry:
        description: "true = fill everything except press Generate"
        type: boolean
        default: true

concurrency:
  group: nexabot-sfv-generate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sfv:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Fetch charsheet
        run: |
          mkdir -p web/public/comic-panels
          # charsheet is generated by the charsheet workflow; reuse the committed copy if present
          if [ ! -f web/public/comic-panels/charsheet.png ]; then
            echo "no charsheet.png found"
          fi
      - name: Generate sfv scene
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
          NB_PROMPT: ${{ inputs.prompt }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            python -m semasa.nexabot_sfv_generate "$RUNNER_TEMP/nexabot-sfv" --sheet web/public/comic-panels/charsheet.png --prompt "$NB_PROMPT" --dry
          else
            python -m semasa.nexabot_sfv_generate "$RUNNER_TEMP/nexabot-sfv" --sheet web/public/comic-panels/charsheet.png --prompt "$NB_PROMPT"
          fi
      - name: Keep scene and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-sfv-generate
          path: /home/runner/work/_temp/nexabot-sfv
          retention-days: 1
          if-no-files-found: ignore
