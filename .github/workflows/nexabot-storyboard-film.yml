name: Nexabot storyboard film

# Build the comic as a TEXT storyboard in Bahasa Melayu, feed each scene to Nexabot t2v (comic/anime style), concatenate
# the four clips and burn the Malay dialogue as subtitles. By hand only.

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "true = do everything except press Generate (spends nothing)"
        type: boolean
        default: true

concurrency:
  group: nexabot-storyboard-film
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  film:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Build the film from the Malay storyboard
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            python -m semasa.nexabot_storyboard_film "$RUNNER_TEMP/nexabot-film" --dry
          else
            python -m semasa.nexabot_storyboard_film "$RUNNER_TEMP/nexabot-film"
          fi
      - name: Keep the film and report (one day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-storyboard-film
          path: /home/runner/work/_temp/nexabot-film
          retention-days: 1
          if-no-files-found: ignore
