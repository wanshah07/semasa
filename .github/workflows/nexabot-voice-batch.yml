name: Nexabot voice batch

# Classify voices (female/male) by generating one test line per voice. Observation run.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "Malay test line"
        required: true
      voices:
        description: "comma list of voice names"
        required: true

concurrency:
  group: nexabot-voice-batch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  batch:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Generate voices
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
          NB_TEXT: ${{ inputs.text }}
          NB_VOICES: ${{ inputs.voices }}
        run: python -m semasa.nexabot_voice_batch "$RUNNER_TEMP/nexabot-voice-batch" --text "$NB_TEXT" --voices "$NB_VOICES"
      - name: Keep audio and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-voice-batch
          path: /home/runner/work/_temp/nexabot-voice-batch
          retention-days: 1
          if-no-files-found: ignore
