name: Nexabot voice generate

# Generate ONE voiceover line through the Nexabot Voice Generator (Unlimited Standard) — an observation run.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "Malay script to speak"
        required: true
      voice:
        description: "Voice name (default Achernar)"
        required: false
        default: "Achernar"
      engine:
        description: "natural | elevenlabs"
        required: false
        default: "natural"
      dry:
        description: "true = fill everything except press Generate Voice"
        type: boolean
        default: true

concurrency:
  group: nexabot-voice-generate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  voice:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Generate voice
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
          NB_TEXT: ${{ inputs.text }}
          NB_VOICE: ${{ inputs.voice }}
          NB_ENGINE: ${{ inputs.engine }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            python -m semasa.nexabot_voice_generate "$RUNNER_TEMP/nexabot-voice" --text "$NB_TEXT" --voice "$NB_VOICE" --engine "$NB_ENGINE" --dry
          else
            python -m semasa.nexabot_voice_generate "$RUNNER_TEMP/nexabot-voice" --text "$NB_TEXT" --voice "$NB_VOICE" --engine "$NB_ENGINE"
          fi
      - name: Keep audio and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-voice-generate
          path: /home/runner/work/_temp/nexabot-voice
          retention-days: 1
          if-no-files-found: ignore
