name: Nexabot voice probe 2

# Read-only: select the ElevenLabs engine in the Voice Generator and dump its voices/controls. Never Generate.
on:
  workflow_dispatch:

concurrency:
  group: nexabot-voice-probe2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Probe ElevenLabs voices
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
        run: python -m semasa.nexabot_voice_probe2 "$RUNNER_TEMP/nexabot-voice2"
      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-voice-probe2
          path: /home/runner/work/_temp/nexabot-voice2
          retention-days: 1
          if-no-files-found: ignore
