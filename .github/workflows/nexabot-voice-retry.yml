name: Nexabot voice retry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Chromium
        run: bash ../.github/scripts/ensure-chromium.sh
      - name: Retry missing lines
        env:
          NEXABOT_STORAGE_STATE_B64: ${{ secrets.NEXABOT_STORAGE_STATE_B64 }}
        run: python -m semasa.nexabot_voice_retry "$RUNNER_TEMP/nexabot-voice-retry"
      - name: Keep audio and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexabot-voice-retry
          path: /home/runner/work/_temp/nexabot-voice-retry
          retention-days: 1
          if-no-files-found: ignore
