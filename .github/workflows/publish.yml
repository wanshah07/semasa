name: Publish

# Studio's release clock: 06:20 · 11:20 · 19:20 MYT (22:20 · 03:20 · 11:20 UTC).
# ws.regulab (Facebook, Instagram, Threads) goes to Buffer for its slot; LinkedIn goes through Composio at its slot.
# While the publishing switch is shut (semasa_settings.publishing: `enabled`, or `enabled_from` not reached yet, or
# `paused`) this SENDS NOTHING: it writes to semasa_publish_log what it would have sent.
# The switch opens by itself at `enabled_from` (supabase/023_go_live.sql), set for the night Studio is retired:
# one schedule per job, never two publishers on one Buffer account.
on:
  schedule:
    - cron: "20 22,3,11 * * *"
  repository_dispatch:
    types: [publish_due]         # Supabase's clock (supabase/009_clock.sql): GitHub's schedule above skips runs
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEMASA_SHEET_URL: ${{ secrets.SEMASA_SHEET_URL }}
          SEMASA_SHEET_TOKEN: ${{ secrets.SEMASA_SHEET_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: python -m semasa.publisher
