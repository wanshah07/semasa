name: Publish

# Studio's release clock: 06:20 · 11:20 · 19:20 MYT (22:20 · 03:20 · 11:20 UTC).
# ws.regulab (Facebook, Instagram, Threads) goes to Buffer for its slot; LinkedIn goes through Composio at its slot.
# While the publishing switch is shut (semasa_settings.publishing: `enabled`, or `enabled_from` not reached yet, or
# `paused`) this SENDS NOTHING: it writes to semasa_publish_log what it would have sent.
# The switch opens by itself at `enabled_from` (supabase/023_go_live.sql), set for the night Studio is retired:
# one schedule per job, never two publishers on one Buffer account.
on:
  schedule:
    - cron: "20 22,3,11 * * *"
  repository_dispatch:
    types: [publish_due]         # Supabase's clock (supabase/009_clock.sql): GitHub's schedule above skips runs
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEMASA_SHEET_URL: ${{ secrets.SEMASA_SHEET_URL }}
          SEMASA_SHEET_TOKEN: ${{ secrets.SEMASA_SHEET_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_CONSUMER_KEY: ${{ secrets.COMPOSIO_CONSUMER_KEY }}
        run: python -m semasa.publisher
      # Nota regulatori on the landing page (Wan, 3 Oct 2026: port what Studio's release run did as its step 9). After the
      # publisher, so a post it just confirmed sent is on the page the same run. It never blocks publishing (continue-on-error)
      # and it needs one secret, LANDING_REPO_TOKEN: a fine-grained token with Contents: write on
      # wanshah07/malaysian-regulatory-affairs ONLY. Without it the step says so and skips; nothing else changes.
      # The rules for what may appear live in that repo (tools/notes_from_semasa.py), not here. Only the page's note
      # file is committed: hook, citation and public links, never a caption.
      - name: Nota regulatori (landing page)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LANDING_REPO_TOKEN: ${{ secrets.LANDING_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${LANDING_REPO_TOKEN:-}" ]; then
            echo "::notice::Nota regulatori skipped: the secret LANDING_REPO_TOKEN is not set (see .github/workflows/publish.yml)"
            exit 0
          fi
          python -m semasa.nota "$RUNNER_TEMP/nota"
          git clone --depth 1 "https://x-access-token:${LANDING_REPO_TOKEN}@github.com/wanshah07/malaysian-regulatory-affairs.git" "$RUNNER_TEMP/landing"
          cd "$RUNNER_TEMP/landing"
          line=$(python3 tools/notes_from_semasa.py "$RUNNER_TEMP/nota" site/src/data/notes.json)
          echo "$line"
          echo "## Nota regulatori" >> "$GITHUB_STEP_SUMMARY"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- site/src/data/notes.json; then exit 0; fi
          git config user.name "semasa"
          git config user.email "semasa@users.noreply.github.com"
          git add site/src/data/notes.json
          git commit -q -m "Nota regulatori: from Semasa ($line)"
          git push origin HEAD:main || { git pull -q --rebase origin main && git push origin HEAD:main; }
