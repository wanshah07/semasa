name: Pustaka repo

# Pustaka repo (Wan, 23 Oct 2026): a repository link added in the Repo tab is read through the GitHub API (never cloned or
# run), checked for what a reading can catch, summarised and filed under a category by the AI
# (backend/semasa/repo_library.py, supabase/042_repo_library.sql). Woken by the database on a new pending row
# (repository_dispatch 'repo_pending'); the daily schedule re-reads a repo whose last push moved and is the net for a
# dispatch GitHub dropped. One schedule, in the repo that owns the job.
on:
  repository_dispatch:
    types: [repo_pending]
  schedule:
    - cron: "10 3 * * *"          # 11:10 MYT
  workflow_dispatch:

concurrency:
  group: repo-library
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  library:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Read, check and file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
          LANDING_REPO_TOKEN: ${{ secrets.LANDING_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ALLOWED_HOSTS: ${{ vars.LLM_ALLOWED_HOSTS }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          LLM_FALLBACK_ALLOWED_HOSTS: ${{ vars.LLM_FALLBACK_ALLOWED_HOSTS }}
        run: python -m semasa.repo_library
