name: Redraw approved posts in place

# By hand, and for the Redraw buttons' requests (Wan, 24 Nov 2026). The original one-off (Wan, 11 Nov 2026: "Re-render the carousels and films", answered "in place, keep approvals").
# Redraws the carousels of ws.regulab posts that are approved or scheduled and not yet sent, and adds the branded cover to their
# films, keeping each post's approval, slot and words. A Zernio copy is deleted first and the publisher queues the post again.
# `dry` lists what would be touched and changes nothing. See backend/semasa/rerender.py.
on:
  # the Redraw buttons (Semasa and Telegram, supabase/093): the page or the bot inserts a row, the database wakes this workflow
  # (repository_dispatch 'post_redraw'); the hourly schedule is the net for a dispatch GitHub dropped. Both only do the pending
  # requests (--requests): nothing is redrawn on a schedule by itself. One schedule, in the repo that owns the job.
  repository_dispatch:
    types: [post_redraw]
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "List only, change nothing"
        type: boolean
        default: true
      only:
        description: "Comma-separated post ids (empty = every candidate)"
        type: string
        default: ""
      send_now:
        description: "Send ONE channel of this post id now (past the lateness rule); needs `channel`"
        type: string
        default: ""
      channel:
        description: "Channel for send_now"
        type: string
        default: "threads"
      threads:
        description: "Instead: queue the Threads posts whose caption has a line of hashtags alone again"
        type: boolean
        default: false

concurrency:
  # its own queue (23 Nov 2026): in the shared `media` group a waiting redraw was replaced by every newer media run, which is how the
  # first dry run was cancelled before it started. Two runs of this workflow still never overlap.
  group: rerender
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rerender:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          # ubuntu-latest no longer ships ffmpeg (motion.yml, 24 Oct 2026); the film cover is an ffmpeg step, and its absence
          # made all nine covers fail on 11 Nov 2026 ("the cover could not be added")
          pip install -r requirements.txt
          bash ../.github/scripts/ensure-ffmpeg.sh        # ffmpeg and ffprobe without apt
      - name: Redraw
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # a slide's picture falls to an Unsplash photograph before KiosAPI is paid (illustrated.ORDER); without the key it is skipped
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_1 }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_2 }}
          ZERNIO_API_KEY_3: ${{ secrets.ZERNIO_API_KEY_3 }}
          # the picture makers and the writer the redraw needs (the same as media.yml): without them only the ChatGPT login held in the
          # database was tried, and its 402 failed every redraw on 23 Nov 2026
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          MEDIA_PROVIDER: ${{ vars.MEDIA_PROVIDER }}
          REPLICATE_T2I_MODEL: ${{ vars.REPLICATE_T2I_MODEL }}
          REPLICATE_IMAGE_MODEL: ${{ vars.REPLICATE_IMAGE_MODEL }}
          REPLICATE_VIDEO_MODEL: ${{ vars.REPLICATE_VIDEO_MODEL }}
          REPLICATE_IMAGE_INPUT_KEY: ${{ vars.REPLICATE_IMAGE_INPUT_KEY }}
          REPLICATE_VIDEO_INPUT_KEY: ${{ vars.REPLICATE_VIDEO_INPUT_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_VIDEO_MODEL: ${{ vars.OPENAI_VIDEO_MODEL }}
          CLOUDFLARE_T2I_MODEL: ${{ vars.CLOUDFLARE_T2I_MODEL }}
          CLOUDFLARE_EDIT_MODEL: ${{ vars.CLOUDFLARE_EDIT_MODEL }}
          CLOUDFLARE_IMAGE_SIZE: ${{ vars.CLOUDFLARE_IMAGE_SIZE }}
          LLM_ALLOWED_HOSTS: ${{ vars.LLM_ALLOWED_HOSTS }}
          LLM_FALLBACK_ALLOWED_HOSTS: ${{ vars.LLM_FALLBACK_ALLOWED_HOSTS }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
          MEDIA_MAX_ATTEMPTS: ${{ vars.MEDIA_MAX_ATTEMPTS }}
          MEDIA_STALE_MINUTES: ${{ vars.MEDIA_STALE_MINUTES }}
          MEDIA_RUN_BUDGET: ${{ vars.MEDIA_RUN_BUDGET }}
          MEDIA_BATCH: ${{ vars.MEDIA_BATCH }}
          MEDIA_POLL_SECONDS: ${{ vars.MEDIA_POLL_SECONDS }}
          MEDIA_MAX_WAIT_IMAGE: ${{ vars.MEDIA_MAX_WAIT_IMAGE }}
          MEDIA_MAX_WAIT_VIDEO: ${{ vars.MEDIA_MAX_WAIT_VIDEO }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE }}
          OPENAI_VIDEO_SECONDS: ${{ vars.OPENAI_VIDEO_SECONDS }}
          OPENAI_VIDEO_SIZE: ${{ vars.OPENAI_VIDEO_SIZE }}
          IDEAS_BATCH: ${{ vars.IDEAS_BATCH }}
          FAQ_BATCH: ${{ vars.FAQ_BATCH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEMASA_SITE_URL: ${{ vars.SEMASA_SITE_URL }}
          EVENT: ${{ github.event_name }}
          DRY: ${{ inputs.dry }}
          ONLY: ${{ inputs.only }}
          THREADS: ${{ inputs.threads }}
          SEND_NOW: ${{ inputs.send_now }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$EVENT" = "repository_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            python -m semasa.rerender --requests
            exit $?
          fi
          args=""
          if [ "$DRY" = "true" ]; then args="--dry"; fi
          if [ "$THREADS" = "true" ]; then args="$args --threads"; fi
          if [ -n "$SEND_NOW" ]; then
            python -m semasa.rerender --send-now "$SEND_NOW" --channel "$CHANNEL"
            exit $?
          fi
          python -m semasa.rerender $args --only "$ONLY"
