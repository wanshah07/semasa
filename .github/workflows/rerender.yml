name: Redraw approved posts in place

# One-off, by hand only (Wan, 11 Nov 2026: "Re-render the carousels and films", answered "in place, keep approvals").
# Redraws the carousels of ws.regulab posts that are approved or scheduled and not yet sent, and adds the branded cover to their
# films, keeping each post's approval, slot and words. A Zernio copy is deleted first and the publisher queues the post again.
# `dry` lists what would be touched and changes nothing. See backend/semasa/rerender.py.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "List only, change nothing"
        type: boolean
        default: true
      only:
        description: "Comma-separated post ids (empty = every candidate)"
        type: string
        default: ""
      send_now:
        description: "Send ONE channel of this post id now (past the lateness rule); needs `channel`"
        type: string
        default: ""
      channel:
        description: "Channel for send_now"
        type: string
        default: "threads"
      threads:
        description: "Instead: queue the Threads posts whose caption has a line of hashtags alone again"
        type: boolean
        default: false

concurrency:
  group: media
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rerender:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          # ubuntu-latest no longer ships ffmpeg (motion.yml, 24 Oct 2026); the film cover is an ffmpeg step, and its absence
          # made all nine covers fail on 11 Nov 2026 ("the cover could not be added")
          timeout 300 sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && timeout 600 sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Redraw
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZERNIO_API_KEY_1: ${{ secrets.ZERNIO_API_KEY_1 }}
          ZERNIO_API_KEY_2: ${{ secrets.ZERNIO_API_KEY_2 }}
          ZERNIO_API_KEY_3: ${{ secrets.ZERNIO_API_KEY_3 }}
          DRY: ${{ inputs.dry }}
          ONLY: ${{ inputs.only }}
          THREADS: ${{ inputs.threads }}
          SEND_NOW: ${{ inputs.send_now }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          args=""
          if [ "$DRY" = "true" ]; then args="--dry"; fi
          if [ "$THREADS" = "true" ]; then args="$args --threads"; fi
          if [ -n "$SEND_NOW" ]; then
            python -m semasa.rerender --send-now "$SEND_NOW" --channel "$CHANNEL"
            exit $?
          fi
          python -m semasa.rerender $args --only "$ONLY"
