name: Scrape isu semasa

on:
  schedule:
    # every 8 hours: 07:17, 15:17 and 23:17 MYT (Wan, 25 Sep 2026: "change kemaskini setiap 2 jam kepada 8 jam")
    - cron: "17 7,15,23 * * *"
  repository_dispatch:
    types: [scrape_due]          # Supabase's clock (supabase/009_clock.sql): GitHub's schedule above skips runs
  workflow_dispatch:
    inputs:
      use_playwright:
        description: "Render HTML-only front pages with Chromium"
        type: boolean
        default: true

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEMASA_SHEET_URL: ${{ secrets.SEMASA_SHEET_URL }}
          SEMASA_SHEET_TOKEN: ${{ secrets.SEMASA_SHEET_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          SCRAPE_USE_PLAYWRIGHT: ${{ github.event_name == 'workflow_dispatch' && (inputs.use_playwright && '1' || '0') || '1' }}
        run: python -m semasa.scraper
