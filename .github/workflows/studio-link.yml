name: Studio link

# ws.regulab Studio → Semasa, until Wan retires Studio (Wan, 27 Sep 2026). Started only by the "Studio link" Routine
# (ops/STUDIO-LINK-ROUTINE.md) after each Studio release run, with the Studio drafts that went out. Their Semasa copies
# leave the drafts for the Arkib (backend/semasa/studio_link.py). It SENDS NOTHING anywhere and never approves anything.
# To retire: delete the Routine; this workflow then never runs again and can be removed at leisure.
on:
  workflow_dispatch:
    inputs:
      posted:
        description: 'JSON: {"<studio draft id>": {"<channel>": {"id": "...", "at": "YYYY-MM-DD HH:MM MYT", "url": "..."}}}'
        type: string
        required: true

concurrency:
  group: studio-link
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  link:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: File Studio's posted drafts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # through the environment, never pasted into the command: the text is data, not shell
          STUDIO_POSTED: ${{ inputs.posted }}
        run: python -m semasa.studio_link
