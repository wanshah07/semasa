name: Telegram

# Semasa on Telegram (Wan, 7 Nov 2026): Wan's messages and button taps reach the semasa-telegram Edge Function, which stores
# them (supabase/069) and the database wakes this workflow (repository_dispatch 'telegram') within seconds. The worker
# (backend/semasa/telegram_bot.py) answers commands, approves through the page's own gate, turns links into ideas on his tap,
# answers questions, and pushes new drafts. Every run also checks the webhook still points at Semasa. The schedule is the
# net for a dropped dispatch and pushes drafts written since. One schedule, in the repo that owns the job.
on:
  repository_dispatch:
    types: [telegram]
  schedule:
    - cron: "5 0-14/2 * * *"      # 08:05 to 22:05 MYT, every 2 hours
  workflow_dispatch:
    inputs:
      latency_probe:
        description: "Measure read-only webhook replies without sending Telegram messages"
        type: boolean
        required: false
        default: false
  push:                           # connect the webhook as soon as a change to the bot is merged
    branches: [main]
    paths: ["backend/semasa/telegram_bot.py", ".github/workflows/telegram.yml"]

concurrency:
  group: telegram
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  telegram:
    if: github.repository != 'wanshah07/argus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Answer Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_ALLOWED_HOSTS: ${{ vars.LLM_ALLOWED_HOSTS }}
          LLM_FALLBACK_ALLOWED_HOSTS: ${{ vars.LLM_FALLBACK_ALLOWED_HOSTS }}
          LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
          SEMASA_SITE_URL: ${{ vars.SEMASA_SITE_URL }}
          SEMASA_TELEGRAM_TRANSPORT: ${{ vars.SEMASA_TELEGRAM_TRANSPORT }}
        run: |
          if [ "${{ inputs.latency_probe }}" = "true" ]; then
            python -m semasa.telegram_latency_probe
          else
            python -m semasa.telegram_bot
          fi
