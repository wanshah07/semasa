<!doctype html>
<html lang="ms" data-theme="facerinna">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the page reaches the iPhone's rounded corners and notch; index.css pads it back with the safe-area insets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Semasa</title>
    <meta name="description" content="Isu semasa Malaysia, dikemas kini setiap dua jam, dan makmal media AI." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Home Screen app (Safari → Share → Add to Home Screen). Paths are relative, like vite.config's base, so they hold at
         /semasa/ and at the custom domain. The status bar stays "default" (dark text on the page colour): "black-translucent"
         would put white clock digits over the light themes. theme-color is updated to the chosen theme by lib/pwa.js. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FBFDFF" />
    <meta name="application-name" content="Semasa" />
    <meta name="apple-mobile-web-app-title" content="Semasa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the fonts arrive without holding the first paint: fetched as a print sheet, switched to all once loaded (the system
         font shows until then, and display=swap keeps the words on screen). The address itself is unchanged. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@300..800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@300..800&display=swap" rel="stylesheet" /></noscript>
    <script>
      // set the theme before first paint so there is no flash; same rule as src/design/themeChoice.js
      (function () {
        var ids = ["facerinna", "noir", "regulab", "mint", "sakura", "lavender", "matahari", "batu", "midnight", "hutan", "bara", "mawar", "lautan", "arang", "kopi"], pick = null, dark = false;
        try {
          pick = localStorage.getItem("semasa.themePick");
          var old = localStorage.getItem("semasa.theme");
          if (ids.indexOf(pick) < 0 && old && old !== "facerinna") pick = old;
        } catch (e) {}
        try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
        document.documentElement.setAttribute("data-theme", ids.indexOf(pick) >= 0 ? pick : dark ? "noir" : "facerinna");
      })();
    </script>
  </head>
  <body class="bg-bg text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
